# Sebagian besar hosting PHP di dunia nyata (terutama environment lama/shared hosting)
# mengonfigurasi lebih dari sekadar ".php" sebagai executable PHP - varian seperti ".phtml"
# dan ".pht" umum diaktifkan untuk kompatibilitas mundur. Image php:8.2-apache resmi HANYA
# mengeksekusi ".php" secara default (lihat /etc/apache2/conf-available/docker-php.conf), jadi
# konfigurasi ini menambahkan varian tersebut secara eksplisit supaya Lab 4 (extension
# blacklist bypass) bisa dipraktikkan seperti pada environment dunia nyata yang lebih longgar.
<Directory "/var/www/html">
    <FilesMatch "\.(phtml|pht)$">
        SetHandler application/x-httpd-php
    </FilesMatch>
</Directory>
