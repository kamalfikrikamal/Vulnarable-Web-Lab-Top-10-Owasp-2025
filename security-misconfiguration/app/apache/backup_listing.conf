# Folder backup/ seharusnya tidak pernah ada di docroot produksi sama sekali,
# apalagi dengan directory listing aktif - tapi ini adalah kasus umum di
# dunia nyata: admin menaruh file backup "sementara" di dalam webroot lalu
# lupa menghapusnya, dan Options +Indexes (baik lewat konfigurasi Apache
# ataupun .htaccess warisan) membuat isinya bisa dijelajahi siapa pun yang
# tahu (atau menebak) path-nya.
<Directory "/var/www/html/backup">
    Options +Indexes
</Directory>
