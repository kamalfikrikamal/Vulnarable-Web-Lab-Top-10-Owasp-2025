# Direktori subsite demo (Lab 7) ikut menyalin .git apa adanya ke webroot.
# Directory listing diaktifkan supaya isi .git/ (termasuk .git/objects/) bisa
# dijelajahi manual tanpa perlu tool khusus - situasi umum kalau server tidak
# secara eksplisit memblokir akses ke dotfiles/dotdirs.
<Directory "/var/www/html/vcs-demo">
    Options +Indexes
</Directory>
